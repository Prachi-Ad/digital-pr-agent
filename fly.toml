app = "prachi-pr-agent"
primary_region = "bom"

[build]

[env]
  PR_AGENT_DATA_DIR = "/data"

[mounts]
  source = "pr_agent_data"
  destination = "/data"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
