[server]
headless = true
port = 8501
enableCORS = true
corsAllowedOrigins = ["http://localhost:8501", "http://127.0.0.1:8501"]
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#5b5bd6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fb"
textColor = "#232135"
