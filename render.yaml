services:
  - type: web
    name: digital-pr-agent
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    disk:
      name: pr-agent-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: PR_AGENT_DATA_DIR
        value: /data
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: BRAND_NAME
        value: Vista Social
      - key: BRAND_DOMAIN
        value: https://vistasocial.com
      - key: PRODUCT_DESCRIPTION
        value: a social media management platform for agencies, brands, and social media teams
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://pr.prachiadmane.com/
